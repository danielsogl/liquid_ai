name: liquid_ai
description: "Run on-device AI models in Flutter with LEAP SDK. Supports text generation, streaming chat, structured output, function calling, and vision."
version: 1.2.2
homepage: https://github.com/danielsogl/liquid_ai
repository: https://github.com/danielsogl/liquid_ai
topics:
  - ai
  - llm
  - on-device
  - machine-learning
  - flutter

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  json_schema: ^5.2.2
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  plugin:
    platforms:
      android:
        package: dev.sogl.liquid_ai
        pluginClass: LiquidAiPlugin
      ios:
        pluginClass: LiquidAiPlugin
